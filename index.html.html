<title>EventStockLab — Charm Bar Command Center</title>

.topbar h1{font-size:19px;margin:0}.top-actions{display:flex;gap:8px;align-items:center}.storage-pill{font-size:12px;padding:7px 10px;border-radius:999px;background:#e8f2ed;color:#245c4b;font-weight:700}
.content{padding:26px 28px 48px;max-width:1500px;margin:0 auto}.page{display:none}.page.active{display:block}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}.page-head h2{font-size:28px;margin:0 0 5px}.page-head p{margin:0;color:var(--muted);max-width:760px;line-height:1.5}

.grid{display:grid;gap:16px}.grid.kpis{grid-template-columns:repeat(5,minmax(140px,1fr));margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.kpi{min-height:118px;position:relative;overflow:hidden}.kpi .label{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.kpi .value{font-size:29px;font-weight:850;margin-top:11px;line-height:1}.kpi .sub{font-size:12px;color:var(--muted);margin-top:9px}.kpi:after{content:"";position:absolute;right:-22px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:rgba(47,107,89,.08)}

.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:760px;background:white}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6d746f;background:#f4f1ea;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);position:sticky;top:0}.table td{padding:11px 12px;border-bottom:1px solid #eeeae2;font-size:13px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#fbfaf6}.right{text-align:right}.center{text-align:center}
.alerts{display:grid;gap:9px}.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#fbfaf6}.alert.good{border-color:#cfe2d6;background:#f2f8f4}.alert.warn{border-color:#e7d0a6;background:#fff9ef}.alert.bad{border-color:#e2b4b1;background:#fff4f3}.alert .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--info);flex:none}.alert.good .dot{background:var(--good)}.alert.warn .dot{background:var(--warn)}.alert.bad .dot{background:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.search{position:relative;min-width:240px;flex:1}.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:10px;background:white}.search:before{content:"⌕";position:absolute;left:11px;top:8px;color:#777;font-size:18px}

.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:#737a75;font-weight:900;margin:23px 0 12px}.hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,20,18,.55);display:none;place-items:center;z-index:100;padding:22px}.modal-backdrop.open{display:grid}.modal{background:var(--surface);border-radius:20px;max-width:980px;width:min(980px,100%);max-height:92vh;overflow:auto;border:1px solid #d6d1c7;box-shadow:0 30px 100px rgba(0,0,0,.25)}.modal.small{max-width:620px}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,253,248,.97);z-index:5}.modal-head h3{margin:0}.modal-body{padding:20px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:rgba(255,253,248,.97)}.close{border:0;background:transparent;font-size:23px;color:#707773;min-width:40px;min-height:40px;border-radius:10px}

function editActionTask(id){const t=id?state.tasks.find(x=>x.id===id):{id:'',title:'',status:'Open',priority:'Medium',dueDate:'',ownerId:'',eventId:'',clientId:'',notes:''};modalShell(id?'Edit Task':'Add Task',`<div class="form-grid cols3"><div class="field" style="grid-column:span 2"><label>Task *</label><input id="tk_title" value="${esc(t.title||'')}"></div><div class="field"><label>Priority</label><select id="tk_priority">${taskPriorities.map(v=>`<option ${t.priority===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Due date</label><input id="tk_due" type="date" value="${esc(t.dueDate||'')}"></div><div class="field"><label>Owner</label><select id="tk_owner"><option value="">Unassigned</option>${state.staff.map(x=>`<option value="${x.id}" ${t.ownerId===x.id?'selected':''}>${esc(x.name)} - ${esc(x.role||'')}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="tk_status">${['Open','Waiting','Done'].map(v=>`<option ${t.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Linked event</label><select id="tk_event"><option value="">None</option>${state.events.map(e=>`<option value="${e.id}" ${t.eventId===e.id?'selected':''}>${esc(e.name)} - ${dateFmt(e.date)}</option>`).join('')}</select></div><div class="field"><label>Linked client</label><select id="tk_client"><option value="">None</option>${state.clients.map(c=>`<option value="${c.id}" ${t.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><div class="field" style="margin-top:12px"><label>Notes</label><textarea id="tk_notes">${esc(t.notes||'')}</textarea></div>`,`<button class="btn" onclick="ESL.close()">Cancel</button>${id?`<button class="btn danger" onclick="ESL.deleteActionTask('${id}')">Delete</button>`:''}<button class="btn primary" onclick="ESL.saveActionTask('${id||''}')">Save Task</button>`,true)}
function editStaff(id){const x=id?state.staff.find(x=>x.id===id):{id:'',name:'',role:'Assistant',email:'',phone:'',defaultRate:state.settings.defaultLaborRate,skills:'',availability:'',active:true,notes:''};modalShell(id?'Edit Staff':'Add Staff',`<div class="form-grid cols3"><div class="field"><label>Name *</label><input id="st_name" value="${esc(x.name||'')}"></div><div class="field"><label>Primary role</label><select id="st_role">${staffRoles.map(v=>`<option ${x.role===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Default hourly rate</label><input id="st_rate" type="number" min="0" step=".01" value="${num(x.defaultRate)}"></div><div class="field"><label>Email</label><input id="st_email" value="${esc(x.email||'')}"></div><div class="field"><label>Phone</label><input id="st_phone" value="${esc(x.phone||'')}"></div><div class="field"><label>Status</label><select id="st_active"><option value="1" ${x.active!==false?'selected':''}>Active</option><option value="0" ${x.active===false?'selected':''}>Inactive</option></select></div><div class="field" style="grid-column:span 2"><label>Skills / responsibilities</label><input id="st_skills" value="${esc(x.skills||'')}"></div><div class="field"><label>Availability notes</label><input id="st_avail" value="${esc(x.availability||'')}"></div></div><div class="field" style="margin-top:12px"><label>Internal notes</label><textarea id="st_notes">${esc(x.notes||'')}</textarea></div>`,`<button class="btn" onclick="ESL.close()">Cancel</button><button class="btn primary" onclick="ESL.saveStaff('${id||''}')">Save Staff</button>`,true)}
function editEventStaff(eventId){const e=state.events.find(x=>x.id===eventId);if(!e)return;const rows=(e.staffAssignments||[]).map(a=>({...a}));const choices=state.staff.filter(x=>x.active!==false||rows.some(a=>a.staffId===x.id));const html=()=>`<div class="notice">Assign named people to this event. Estimated hours × rate replace the generic staff-count labor estimate, so event profitability reflects the planned team.</div><div id="asg_rows">${rows.map((a,i)=>`<div class="lineitem-row"><div class="wide field"><label>Staff</label><select data-asg="staffId" data-i="${i}"><option value="">Choose...</option>${choices.map(x=>`<option value="${x.id}" ${a.staffId===x.id?'selected':''}>${esc(x.name)} - ${esc(x.role||'')}</option>`).join('')}</select></div><div class="field"><label>Role</label><select data-asg="role" data-i="${i}">${staffRoles.map(v=>`<option ${a.role===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Est. hours</label><input data-asg="estimatedHours" data-i="${i}" type="number" min="0" step=".25" value="${num(a.estimatedHours)}"></div><div class="field"><label>Actual hours</label><input data-asg="actualHours" data-i="${i}" type="number" min="0" step=".25" value="${num(a.actualHours)}"></div><div class="field"><label>Rate</label><input data-asg="rate" data-i="${i}" type="number" min="0" step=".01" value="${num(a.rate)}"></div><button class="btn small danger" onclick="ESL.removeEventStaffRow(${i})">Remove</button></div>`).join('')||'<div class="empty"><strong>No named staff assigned</strong>Add a team member to use staff-specific labor costing.</div>'}</div><button class="btn" style="margin-top:12px" onclick="ESL.addEventStaffRow()">+ Assignment</button>`;window._eslStaffDraft={eventId,rows,html};modalShell('Event Staff Assignments',html(),`<button class="btn" onclick="ESL.close()">Cancel</button><button class="btn primary" onclick="ESL.saveEventStaff()">Save Assignments</button>`) }
function viewClient(id){const c=state.clients.find(x=>x.id===id);if(!c)return;const stats=clientEventStats(c),tl=clientTimeline(c),openTasks=clientLinkedTasks(c.id).filter(t=>t.status!=='Done'),value=clientLifetime(c),last=stats.lastEvent,interactions=clientInteractionsFor(c);const body=`<div class="form-grid cols4"><div><div class="tiny muted">${esc(c.organizationType||'Charm-bar client / lead')}</div><div class="strong" style="font-size:24px">${esc(c.name)}</div><div class="tiny muted">${esc(c.email||'')}${c.email&&c.phone?' • ':''}${esc(c.phone||'')}</div></div><div><div class="tiny muted">Pipeline</div>${statusBadge(c.status||'Inquiry')}<div class="tiny muted" style="margin-top:6px">${num(c.probability)}% probability • ${esc(c.leadSource||'Unknown source')}</div></div><div><div class="tiny muted">Tracked lifetime value</div><strong style="font-size:22px">${money2(value,state)}</strong><div class="tiny muted">${stats.events.length} event${stats.events.length===1?'':'s'} • ${stats.completed.length} completed</div></div><div><div class="tiny muted">Relationship</div><strong>${stats.isRepeat?'Repeat host / client':'New / developing'}</strong><div class="tiny muted">${stats.referrals} referral${stats.referrals===1?'':'s'} attributed • ${interactions.length} contact log${interactions.length===1?'':'s'}</div></div></div><div class="section-title">Charm-bar preference profile</div><div class="preference-grid"><div><small>Preferred pieces</small><strong>${esc(c.preferredPieces||'Not saved')}</strong></div><div><small>Finish</small><strong>${esc(c.preferredFinish||'Customer choice')}</strong></div><div><small>Favorite themes</small><strong>${esc(c.favoriteThemes||'Not saved')}</strong></div><div><small>Event format</small><strong>${esc(c.preferredEventFormat||'Not saved')}</strong></div><div><small>Typical guest count</small><strong>${num(c.typicalGuestCount)||'—'}</strong></div><div><small>Budget / package range</small><strong>${esc(c.budgetRange||'Not saved')}</strong></div></div>${c.avoidPreferences?`<div class="notice" style="margin-top:10px"><strong>Avoid / sensitivity / style exclusions</strong><br>${esc(c.avoidPreferences)}</div>`:''}<div class="section-title">Next relationship action</div><div class="notice"><strong>${esc(c.nextAction||'No next action recorded')}</strong>${c.nextFollowUp?`<br>Follow up ${dateFmt(c.nextFollowUp)}`:''}${c.rebookingDate?`<br>Rebooking target ${dateFmt(c.rebookingDate)}${c.rebookingInterest?' • '+esc(c.rebookingInterest):''}`:''}${c.lossReason?`<br>Lost reason: ${esc(c.lossReason)}`:''}</div>${last?`<div class="section-title">Most recent event</div><div class="connected-banner"><strong>${esc(last.name)}</strong> • ${dateFmt(last.date)} • ${esc(last.status)} <button class="btn small" style="margin-left:8px" onclick="ESL.viewEvent('${last.id}')">Open</button> <button class="btn small" onclick="ESL.rebookEvent('${last.id}')">Rebook from this</button></div>`:''}<div class="section-title">Connected timeline</div>${tl.length?`<div class="timeline">${tl.slice(0,40).map(x=>`<div class="timeline-item"><div class="timeline-date">${dateFmt(x.date)}<br>${esc(x.kind)}</div><div><strong>${esc(x.title)}</strong><div class="tiny muted">${esc(x.detail)}</div>${x.eventId?`<button class="btn small" style="margin-top:6px" onclick="ESL.viewEvent('${x.eventId}')">Open event</button>`:''}</div></div>`).join('')}</div>`:'<div class="empty"><strong>No connected history yet</strong>Events, contact logs, payments, sessions, requests and tasks linked to this client will appear here.</div>'}${c.notes?`<div class="section-title">Notes</div><div class="notice">${esc(c.notes)}</div>`:''}`;modalShell('Client 360',body,`<button class="btn" onclick="ESL.editClientInteraction('${c.id}')">+ Log Contact</button><button class="btn" onclick="ESL.editActionTaskForClient('${c.id}')">+ Follow-up Task</button><button class="btn" onclick="ESL.close();ESL.newEvent(null,'${c.id}')">+ New Event</button><button class="btn primary" onclick="ESL.close();ESL.editClient('${c.id}')">Edit Client</button>`)}

function poRemainingUnits(po){return sum(po.lineItems,l=>Math.max(0,num(l.orderedQty)-num(l.receivedQty)))}
function poReceivedUnits(po){return sum(po.lineItems,l=>Math.max(0,num(l.receivedQty)))}
function poSupplier(po){return state.suppliers.find(s=>s.id===po.supplierId)}
function poStatusClass(status){return status==='Received'?'good':status==='Partially received'?'warn':status==='Cancelled'?'bad':status==='Ordered'?'info':''}
function supplierStats(s){const pos=state.purchaseOrders.filter(po=>po.supplierId===s.id&&po.status!=='Cancelled'),received=pos.filter(po=>po.status==='Received'),ordered=sum(pos,po=>sum(po.lineItems,l=>l.orderedQty)),got=sum(pos,po=>sum(po.lineItems,l=>l.receivedQty)),actualLead=received.map(po=>{const a=new Date((po.orderDate||po.createdAt.slice(0,10))+'T12:00:00'),b=new Date((po.receivedAt||po.orderDate)+'T12:00:00');return Math.max(0,Math.round((b-a)/86400000))});return{orders:pos.length,open:pos.filter(po=>['Draft','Ordered','Partially received'].includes(po.status)).length,spend:sum(pos,po=>poTotal(po)),fill:ordered?Math.min(100,got/ordered*100):0,avgLead:actualLead.length?avg(actualLead):null,score:([num(s.qualityRating),num(s.reliabilityRating)].filter(Boolean).reduce((a,b)=>a+b,0)/Math.max(1,[num(s.qualityRating),num(s.reliabilityRating)].filter(Boolean).length))}}

function assetPreviewHTML(d){const style=assetStyleById(d.styleId),c=assetContent(d.assetKey,d.eventId),accent=assetSafeHex(d.accentOverride,style.accent),accent2=assetSafeHex(d.accent2Override,style.accent2),paper=assetSafeHex(d.paperOverride,style.paper),ink=assetSafeHex(d.inkOverride,style.ink),logo=state.settings.logoData&&d.logoMode!=='Hide'?`<img class="asset-logo" src="${state.settings.logoData}" alt="Business logo">`:'';const border=d.borderStyle==='None'?'0':d.borderStyle==='Double'?'5px double var(--asset-accent)':d.borderStyle==='Rounded'?'2px solid var(--asset-accent)':'1px solid color-mix(in srgb,var(--asset-ink) 25%,transparent)';return `<div class="asset-preview-page ${assetPreviewClass(d)}" style="--asset-paper:${paper};--asset-ink:${ink};--asset-accent:${accent};--asset-accent2:${accent2};--asset-contrast:${contrastColor(accent)};--asset-pattern-opacity:${clamp(num(d.patternIntensity)/100,0,1)};--asset-logo-scale:${clamp(num(d.logoScale,100),50,180)/100};--asset-spacing:${clamp(num(d.spacing,100),70,150)/100};--asset-font:${assetFontStack(d.fontStyle||style.font)};border:${border};border-radius:${d.borderStyle==='Rounded'?'24px':'3px'}">${logo}${d.blocks.map(b=>assetBlockHTML(b,c,d,style)).join('')}</div>`}

function openModal(html,small=false){const root=document.getElementById('modalRoot');modalReturnFocus=document.activeElement;document.getElementById('appShell')?.setAttribute('inert','');root.innerHTML=`<div class="modal ${small?'small':''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${html}</div>`;root.classList.add('open');root.onclick=e=>{if(e.target===root)closeModal()};root.onkeydown=e=>{if(e.key!=='Tab')return;const modal=root.querySelector('.modal'),focusable=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')].filter(x=>x.getAttribute('aria-hidden')!=='true');if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}};setTimeout(()=>{enhanceAccessibility();const target=root.querySelector('.modal-body input:not([type="hidden"]):not([disabled]),.modal-body select:not([disabled]),.modal-body textarea:not([disabled])')||root.querySelector('.modal-foot button:not([disabled]),.modal-head button:not([disabled])');target?.focus()},0)}

stHtml}${g.unmatched.length?`<div class="notice warn" style="margin-top:10px"><strong>Unmatched charm codes:</strong> ${g.unmatched.slice(0,12).map(z=>esc(z.guest)+': '+esc(z.token)).join(' • ')}${g.unmatched.length>12?' • …':''}</div>`:''}${marketHtml}${kitHtml}<div class="section-title">Closeout readiness</div><div class="risk-list"><div class="risk-row ${x.runPct>=100?'good':''}" style="grid-template-columns:1fr auto"><div><strong>Run sheet</strong><div class="tiny muted">${x.runDone}/${x.runTotal} actions complete</div></div><span class="status ${x.runPct>=100?'good':'info'}">${x.runPct.toFixed(0)}%</span></div><div class="risk-row ${x.stockDone?'good':x.activeReservations?'warn':''}" style="grid-template-columns:1fr auto"><div><strong>Event stock closeout</strong><div class="tiny muted">${x.activeReservations} active reservation line${x.activeReservations===1?'':'s'} • POS deductions are protected from double-counting</div></div><button class="btn small" onclick="ESL.openEventStockCloseout('${e.id}')">${x.stockDone?'Review':'Reconcile stock'}</button></div></div>`;modalShell('Event Command',body,`<button class="btn" onclick="ESL.close()">Close</button><button class="btn" onclick="ESL.printEventRunSheet('${e.id}')">Print Run Sheet</button><button class="btn" onclick="ESL.printEventCloseout('${e.id}')">Print Closeout</button><button class="btn primary" onclick="ESL.saveEventCommand('${e.id}')">Save Event Command</button>`,true)}

function saveEventCommand(id){const e=state.events.find(x=>x.id===id);if(!e)return;const stage=document.getElementById('cmd_stage')?.value||e.executionStatus||'Prep';if(stage==='Closed'&&e.status!=='Completed'){alert('Close out the event first so actual results are saved before Event Command moves to Closed.');return}if(stage==='Closed'&&activeEventReservations(e).length&&e.stockCloseout?.status!=='Applied'){alert('Stock closeout is still due. Apply the event stock closeout before moving this event to Closed.');return}e.executionStatus=stage;e.eventStartedAt=document.getElementById('cmd_started')?.value||e.eventStartedAt||'';e.eventEndedAt=document.getElementById('cmd_ended')?.value||e.eventEndedAt||'';if(stage==='Live'&&!e.eventStartedAt)e.eventStartedAt=new Date().toISOString();if(['Closeout due','Closed'].includes(stage)&&!e.eventEndedAt)e.eventEndedAt=new Date().toISOString();if(isPopUpEvent(e)){e.popUpMetrics={footTraffic:Math.max(0,Math.round(num(document.getElementById('cmd_traffic')?.value))),piecesBuilt:Math.max(0,Math.round(num(document.getElementById('cmd_pieces')?.value))),leadsCaptured:Math.max(0,Math.round(num(document.getElementById('cmd_leads')?.value))),rebookDecision:document.getElementById('cmd_rebook')?.value||'Not reviewed',nextMarketDate:document.getElementById('cmd_nextmarket')?.value||'',notes:String(document.getElementById('cmd_marketnotes')?.value||'').trim().slice(0,1500)}}if(isKitEvent(e)){const old=e.fulfillmentStatus||'Not started',next=document.getElementById('cmd_fulfill')?.value||old;e.kitPackedBy=String(document.getElementById('cmd_packedby')?.value||'').trim().slice(0,160);e.packageCount=Math.max(0,Math.round(num(document.getElementById('cmd_packages')?.value,1)));e.carrier=String(document.getElementById('cmd_carrier')?.value||'').trim().slice(0,120);e.trackingNumber=String(document.getElementById('cmd_tracking')?.value||'').trim().slice(0,240);e.shipByDate=document.getElementById('cmd_shipby')?.value||'';applyKitFulfillmentStatus(e,next);}addActivity(`Updated event-day command: ${e.name} — ${e.executionStatus}`);scheduleSave();closeModal();renderAll();viewEvent(id)}

function toggleGuestCheckIn(eventId,guestId,checked){const e=state.events.find(x=>x.id===eventId),g=e?.guestSelections?.find(x=>x.id===guestId);if(!g)return;g.checkedInAt=checked?new Date().toISOString():'';if(checked&&g.rsvpStatus==='Invited')g.rsvpStatus='Yes';addActivity(`${checked?'Checked in':'Reopened check-in for'} ${g.name||'guest'} — ${e.name}`);scheduleSave();closeModal();renderAll();openEventCommand(eventId)}
function toggleGuestCompleted(eventId,guestId,checked){const e=state.events.find(x=>x.id===eventId),g=e?.guestSelections?.find(x=>x.id===guestId);if(!g)return;g.completedAt=checked?new Date().toISOString():'';g.status=checked?'Completed':(g.charmCodes?'Preselected':'Not started');if(checked&&!g.checkedInAt)g.checkedInAt=new Date().toISOString();addActivity(`${checked?'Completed':'Reopened'} guest piece for ${g.name||'guest'} — ${e.name}`);scheduleSave();closeModal();renderAll();openEventCommand(eventId)}

function openEventStockCloseout(id){const e=state.events.find(x=>x.id===id);if(!e)return;const rows=eventStockCloseoutCandidates(e);if(!rows.length){modalShell('Event Stock Closeout',`<div class="empty"><strong>No reserved or POS-linked inventory lines</strong>This event has no exact-SKU reservations, POS stock effects or previous stock-closeout lines to reconcile.</div>`,`<button class="btn" onclick="ESL.close()">Close</button>`,true);return}const body=`<div class="notice"><strong>Safe closeout rule:</strong> exact-SKU POS sales shown below have already changed inventory and are <strong>not deducted again</strong>. Enter only additional event use outside POS, damage and missing quantities. Saving releases active event reservations.</div><div class="table-wrap" style="margin-top:12px"><table class="table closeout-table" style="min-width:930px"><thead><tr><th>SKU / item</th><th class="right">Reserved</th><th class="right">POS deducted</th><th class="right">Additional used</th><th class="right">Damaged</th><th class="right">Missing</th><th class="right">Expected return</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><strong>${esc(r.name)}</strong><div class="tiny muted">${esc(r.sku)}</div><input type="hidden" id="sc_id_${i}" value="${esc(r.inventoryItemId)}"></td><td class="right">${r.reservedQty}</td><td class="right">${r.posQty}</td><td class="right"><input id="sc_used_${i}" aria-label="Additional used quantity for ${esc(r.sku)} ${esc(r.name)}" type="number" min="0" step="1" value="${r.usedQty}"></td><td class="right"><input id="sc_damage_${i}" aria-label="Damaged quantity for ${esc(r.sku)} ${esc(r.name)}" type="number" min="0" step="1" value="${r.damagedQty}"></td><td class="right"><input id="sc_missing_${i}" aria-label="Missing quantity for ${esc(r.sku)} ${esc(r.name)}" type="number" min="0" step="1" value="${r.missingQty}"></td><td class="right"><strong>${r.returnedQty}</strong><div class="tiny muted">recalculated on save</div></td></tr>`).join('')}</tbody></table></div><div class="field" style="margin-top:12px"><label>Closeout notes</label><textarea id="sc_notes" placeholder="Breakage detail, missing tray note, unused stock returned to storage…">${esc(e.stockCloseout?.notes||'')}</textarea></div>`;modalShell('Event Stock Closeout',body,`<button class="btn" onclick="ESL.close()">Cancel</button><button class="btn primary" onclick="ESL.saveEventStockCloseout('${id}',${rows.length})">Apply Stock Closeout</button>`,true)}

function saveEventStockCloseout(id,count){const e=state.events.find(x=>x.id===id);if(!e)return;const prior=new Map((e.stockCloseout?.lines||[]).map(x=>[x.inventoryItemId,x])),current=eventStockCloseoutCandidates(e),baseMap=new Map(current.map(x=>[x.inventoryItemId,x])),lines=[],deltas={};for(let i=0;i<count;i++){const inventoryItemId=document.getElementById('sc_id_'+i)?.value,item=state.inventory.find(x=>x.id===inventoryItemId),base=baseMap.get(inventoryItemId);if(!inventoryItemId||!base)continue;const usedQty=Math.max(0,Math.round(num(document.getElementById('sc_used_'+i)?.value))),damagedQty=Math.max(0,Math.round(num(document.getElementById('sc_damage_'+i)?.value))),missingQty=Math.max(0,Math.round(num(document.getElementById('sc_missing_'+i)?.value))),prev=prior.get(inventoryItemId)||{},oldDeduct=Math.max(0,Math.round(num(prev.usedQty)))+Math.max(0,Math.round(num(prev.damagedQty)))+Math.max(0,Math.round(num(prev.missingQty))),newDeduct=usedQty+damagedQty+missingQty,delta=oldDeduct-newDeduct;if(delta&&(!item||num(item.stock)+delta<0)){alert(`Not enough current stock to apply the closeout adjustment for ${base.name}. Current stock: ${item?item.stock:0}.`);return}deltas[inventoryItemId]=(deltas[inventoryItemId]||0)+delta;lines.push({inventoryItemId,sku:base.sku,name:base.name,reservedQty:base.reservedQty,posQty:base.posQty,usedQty,damagedQty,missingQty,returnedQty:Math.max(0,base.reservedQty-base.posQty-newDeduct),unitCostAtCloseout:Math.max(0,num(item?.costHistory?.slice(-1)[0]?.landedUnitCost,item?.unitCost||0))})}commitInventoryDeltas(deltas,`Event stock closeout — ${e.name}`,e.id,'Event closeout');const now=new Date().toISOString();for(const r of state.stockReservations.filter(r=>r.eventId===e.id&&r.status==='Active')){r.status='Released';r.releasedAt=now;r.note=[r.note,'Released by event stock closeout'].filter(Boolean).join(' • ').slice(0,500)}e.stockCloseout={status:'Applied',completedAt:now,notes:String(document.getElementById('sc_notes')?.value||'').trim().slice(0,1500),lines};if(e.status==='Completed'){e.executionStatus='Closed';if(!e.eventEndedAt)e.eventEndedAt=now}else if(e.executionStatus==='Live'||e.executionStatus==='Ready'||e.executionStatus==='Prep')e.executionStatus='Closeout due';addActivity(`Applied event stock closeout: ${e.name}`);scheduleSave();closeModal();renderAll();viewEvent(id)}

function printEventCloseout(id){const e=state.events.find(x=>x.id===id);if(!e)return;const x=eventExecutionSummary(e),c=eventLinkedCloseout(e),top=popUpTopSellers(e),lines=e.stockCloseout?.lines||[],market=e.popUpMetrics||{};printView('Charm Bar Event Closeout',`<div class="doc-grid"><div class="doc-box"><label>Event</label><strong>${esc(e.name)}</strong><div class="card-small muted">${dateFmt(e.date)}${e.startTime?' • '+esc(fmtTime(e.startTime)):''} • ${esc(e.venue||e.type)}</div></div><div class="doc-box"><label>Execution</label><strong>${esc(e.executionStatus||'Prep')}</strong><div class="card-small muted">${x.checked}/${x.guestCount||0} roster guests checked in • run sheet ${x.runPct.toFixed(0)}%</div></div></div><h2>Connected closeout snapshot</h2><table class="doc-table"><tr><th>Guest/POS receipts</th><th>Host receipts</th><th>Sales tax tracked</th><th>Payment fees</th><th>Linked expenses + mileage</th></tr><tr><td>${money2(c.guestNet,state)}</td><td>${money2(c.hostNet,state)}</td><td>${money2(c.tax,state)}</td><td>${money2(c.fees,state)}</td><td>${money2(c.expenses.total,state)}</td></tr></table>${lines.length?`<h2>Event stock reconciliation</h2><table class="doc-table"><tr><th>SKU / item</th><th class="r">Reserved</th><th class="r">POS</th><th class="r">Other use</th><th class="r">Damaged</th><th class="r">Missing</th><th class="r">Expected return</th></tr>${lines.map(r=>`<tr><td><strong>${esc(r.name)}</strong><div class="card-small muted">${esc(r.sku)}</div></td><td class="r">${r.reservedQty}</td><td class="r">${r.posQty}</td><td class="r">${r.usedQty}</td><td class="r">${r.damagedQty}</td><td class="r">${r.missingQty}</td><td class="r">${r.returnedQty}</td></tr>`).join('')}</table>`:'<p class="muted">No exact-SKU stock closeout has been applied yet.</p>'}${isPopUpEvent(e)?`<h2>Pop-up / market result</h2><table class="doc-table"><tr><th>Foot traffic</th><th>Pieces built</th><th>Leads</th><th>Rebook decision</th></tr><tr><td>${num(market.footTraffic)}</td><td>${num(market.piecesBuilt)}</td><td>${num(market.leadsCaptured)}</td><td>${esc(market.rebookDecision||'Not reviewed')}</td></tr></table>${top.length?`<p><strong>Top exact-SKU sellers:</strong> ${top.map(z=>esc(z.name)+' ('+z.qty+')').join(' • ')}</p>`:''}${market.notes?`<div class="terms">${esc(market.notes)}</div>`:''}`:''}${isKitEvent(e)?`<h2>Kit fulfillment</h2><table class="doc-table"><tr><th>Status</th><th>Packed by</th><th>Packages</th><th>Tracking</th></tr><tr><td>${esc(e.fulfillmentStatus||'Not started')}</td><td>${esc(e.kitPackedBy||'—')}</td><td>${num(e.packageCount)}</td><td>${esc(e.trackingNumber||'—')}</td></tr></table>`:''}<div class="terms"><strong>Stock closeout notes:</strong> ${esc(e.stockCloseout?.notes||'—')}<br><strong>Event notes:</strong> ${esc(e.notes||'—')}</div>`,eventPrintOpts(e,{internal:true}))}

"margin-top:10px"><label>Product photo (optional)</label><input id="ii_image" type="file" accept="image/png,image/jpeg,image/webp"><small>Automatically optimized for local storage. Use a clean square-ish product photo.</small></div>${i.imageData?`<label class="toggle" style="margin-top:10px"><input id="ii_remove_image" type="checkbox"> Remove current photo</label>`:''}</div><div>${i.imageData?`<img src="${i.imageData}" style="width:100%;max-height:210px;object-fit:cover;border-radius:16px;border:1px solid var(--line)">`:`<div class="catalog-photo" style="border-radius:16px;min-height:150px"><div class="catalog-placeholder">${esc((i.displayCode||i.sku||'CB').slice(0,3))}</div></div>`}</div></div><div class="section-title">Notes</div><div class="field"><label for="ii_notes">Internal inventory notes</label><textarea id="ii_notes">${esc(i.notes)}</textarea></div>`;modalShell(old?'Edit charm-bar inventory item':'Add charm-bar inventory item',body,`<button class="btn" onclick="ESL.close()">Cancel</button>${old?`<button class="btn danger" onclick="ESL.deleteInventory('${id}')">Delete</button>`:''}<button class="btn primary" onclick="ESL.saveInventory('${id||''}')">Save Item</button>`)}

 async onboard(mode){const currentLicense=state?.settings?.license||null;state.settings.setupComplete=true;if(mode==='empty'||mode==='guided'){const st={...defaultSettings(),setupComplete:true,setupCoachDismissed:false,license:currentLicense};state={schema:CURRENT_SCHEMA,version:APP_VERSION,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),settings:st,inventory:[],suppliers:[],events:[],packages:[],retailMenu:defaultRetailMenu(),charmCollections:[],clients:[],clientInteractions:[],sales:[],expenses:[],marketingPosts:[],appointments:[],customOrders:[],cashReconciliations:[],inventoryMovements:[],tasks:[],staff:[],purchaseOrders:[],stockReservations:[],cycleCounts:[],assetTemplates:[],activity:[{id:uid('act'),date:new Date().toISOString(),text:mode==='guided'?'Started guided setup':'Created empty workspace'}]}}else{addActivity('Completed first-run setup')}await saveNow();resetTableViewState();closeModal();renderAll();go(mode==='guided'?'help':'dashboard')},

document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});document.getElementById('quickEventBtn').onclick=()=>newEvent();document.getElementById('quickBackupBtn').onclick=()=>backup();document.getElementById('quickHelpBtn').onclick=()=>go('help');document.getElementById('quickActionsBtn').onclick=()=>quickActions();document.getElementById('menuBtn').onclick=()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('menuBtn').setAttribute('aria-expanded',String(open))};document.addEventListener('keydown',e=>{const tag=String(document.activeElement?.tagName||'').toLowerCase(),typing=['input','textarea','select'].includes(tag)||document.activeElement?.isContentEditable;if(e.key==='Escape'&&document.getElementById('modalRoot')?.classList.contains('open')){closeModal();return}if(!typing&&e.key==='?'){e.preventDefault();go('help');return}if(!typing&&(e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){e.preventDefault();quickActions()}});document.getElementById('restoreFile').onchange=e=>{if(e.target.files[0])restoreFile(e.target.files[0]);e.target.value=''};document.getElementById('csvFile').onchange=e=>{if(e.target.files[0])importCSV(e.target.files[0]);e.target.value=''};document.getElementById('logoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>2*1024*1024){alert('Please choose a PNG, JPG, or WebP logo under 2 MB.');e.target.value='';return}const r=new FileReader();r.onload=()=>{state.settings.logoData=r.result;addActivity('Updated business logo');scheduleSave();renderAll();go('settings')};r.readAsDataURL(f);e.target.value=''};document.getElementById('qrFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>2*1024*1024){alert('Please choose a PNG, JPG, or WebP QR image under 2 MB.');e.target.value='';return}const r=new FileReader();r.onload=()=>{state.settings.qrData=r.result;addActivity('Updated QR sign image');scheduleSave();renderAll();go('marketing')};r.readAsDataURL(f);e.target.value=''};document.getElementById('licenseFile').onchange=e=>{if(e.target.files[0])activateLicense(e.target.files[0]);e.target.value=''};document.getElementById('assetPhotoFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state.settings.assetPhotoData=await imageFileData(f,900,700000);addActivity('Updated Asset Studio brand photo');scheduleSave();renderAll();if(assetDraft)refreshAssetPreview();go('assets')}catch(err){alert(err.message||'Could not use that image.')}e.target.value=''};
const menuButton=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar');menuButton.addEventListener('click',()=>{const open=sidebar.classList.contains('open');menuButton.setAttribute('aria-label',open?'Close navigation':'Open navigation');if(open)setTimeout(()=>sidebar.querySelector('button[data-page]')?.focus(),0)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sidebar.classList.contains('open')&&!document.getElementById('modalRoot')?.classList.contains('open')){sidebar.classList.remove('open');menuButton.setAttribute('aria-expanded','false');menuButton.setAttribute('aria-label','Open navigation');menuButton.focus()}});
const flushPendingSave=(reason)=>{if(writeConflict||!savePending)return;if(saveTimer){clearTimeout(saveTimer);saveTimer=null}try{touchUpdatedAt();baseRevision=localCommit(baseRevision);storageMode='Browser storage fallback'}catch(e){console.warn('Final synchronous fallback save failed',e)}};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPendingSave('Backgrounding')});window.addEventListener('pagehide',()=>flushPendingSave('Page hide'));window.addEventListener('beforeunload',()=>flushPendingSave('Closing'));
load().then(async()=>{await revalidateStoredLicense();renderAll();go('dashboard');updateStoragePill(storageMode==='IndexedDB'?'Saved locally':storageMode);showLicenseLock();if(state.settings.license?.verified)setTimeout(showOnboarding,250)}).catch(e=>{console.error(e);alert('EventStockLab could not start correctly. '+e.message)});
})();
